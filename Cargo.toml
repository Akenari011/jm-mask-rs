[package]
name = "jm-mask-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray", "api-22"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
